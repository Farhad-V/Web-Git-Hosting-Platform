server {
    listen 80;
    listen [::]:80;

    server_name gitforge.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name gitforge.example.com;

    root /var/www/gitforge/frontend/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/gitforge.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gitforge.example.com/privkey.pem;

    server_tokens off;

    client_max_body_size 100m;

    access_log /var/log/nginx/gitforge-access.log;
    error_log /var/log/nginx/gitforge-error.log;

    location ^~ /api/ {
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/gitforge/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;

        fastcgi_pass unix:/run/php/php8.4-fpm-gitforge.sock;

        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;
    }

    location ~ ^/[^/]+/[^/]+\.git/(?:info/refs|git-upload-pack|git-receive-pack)$ {
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/gitforge/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;

        fastcgi_pass unix:/run/php/php8.4-fpm-gitforge.sock;

        fastcgi_request_buffering off;
        fastcgi_buffering off;

        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;

        client_max_body_size 100m;
    }

    location = /up {
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/gitforge/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;

        fastcgi_pass unix:/run/php/php8.4-fpm-gitforge.sock;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:env|log|ini|conf|sql|bak)$ {
        deny all;
    }
}