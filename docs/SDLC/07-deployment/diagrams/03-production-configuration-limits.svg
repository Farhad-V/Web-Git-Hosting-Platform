<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:706px;height:647px;background:#FFFFFF;" width="706px" height="647px" viewBox="0 0 706 647" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="9"><text x="199.754" y="28.76" fill="#172033" font-size="20" textLength="300.059" font-weight="700" font-family="Arial">Git transport and preview limits</text></g><!--entity Client--><g class="entity" data-qualified-name="Client" id="ent0001" data-source-line="10"><ellipse cx="368.133" cy="57.998" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M368.133,65.998 L368.133,92.998 M355.133,73.998 L381.133,73.998 M368.133,92.998 L355.133,107.998 M368.133,92.998 L381.133,107.998" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="297" y="124.506" fill="#172033" font-size="16" textLength="142.266" font-family="Arial">Git client or browser</text></g><!--entity Nginx--><g class="entity" data-qualified-name="Nginx" id="ent0002" data-source-line="11"><rect x="229" y="188.498" width="278.344" height="66.797" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="487.344" y="193.498" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="485.344" y="195.498" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="485.344" y="199.498" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="244" y="223.506" fill="#172033" font-size="16" textLength="169.883" font-family="Arial">Nginx request boundary</text><text x="244" y="241.904" fill="#172033" font-size="16" textLength="238.344" font-family="Arial">100m body; 60s FastCGI defaults</text></g><!--entity API--><g class="entity" data-qualified-name="API" id="ent0003" data-source-line="12"><rect x="79" y="333.498" width="265.953" height="66.797" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="324.953" y="338.498" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="322.953" y="340.498" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="322.953" y="344.498" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="94" y="368.506" fill="#172033" font-size="16" textLength="144.953" font-family="Arial">Laravel Git transport</text><text x="94" y="386.904" fill="#172033" font-size="16" textLength="225.953" font-family="Arial">104857600-byte request default</text></g><!--entity Git--><g class="entity" data-qualified-name="Git" id="ent0004" data-source-line="13"><rect x="113" y="478.498" width="198.289" height="66.797" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="291.289" y="483.498" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="289.289" y="485.498" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="289.289" y="489.498" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="128" y="513.506" fill="#172033" font-size="16" textLength="158.289" font-family="Arial">Controlled Git process</text><text x="128" y="531.904" fill="#172033" font-size="16" textLength="127.203" font-family="Arial">30-second default</text></g><!--entity Browse--><g class="entity" data-qualified-name="Browse" id="ent0005" data-source-line="14"><rect x="380" y="333.498" width="289.867" height="66.797" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="649.867" y="338.498" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="647.867" y="340.498" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="647.867" y="344.498" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="395" y="368.506" fill="#172033" font-size="16" textLength="137.828" font-family="Arial">Repository browser</text><text x="395" y="386.904" fill="#172033" font-size="16" textLength="249.867" font-family="Arial">Text: 1 MiB; PDF: 100 MiB defaults</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="19"><path d="M358.5,498.998 L358.5,525.097 A0,0 0 0 0 358.5,525.097 L691.567,525.097 A0,0 0 0 0 691.567,525.097 L691.567,508.998 L681.567,498.998 L529,498.998 L525,400.808 L521,498.998 L358.5,498.998 A0,0 0 0 0 358.5,498.998" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M681.567,498.998 L681.567,508.998 L691.567,508.998 L681.567,498.998" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="364.5" y="517.13" fill="#172033" font-size="14" textLength="312.067" font-family="Arial">Preview bounds are independent of Git push limits</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="20"><path d="M6,606.498 L6,632.597 A0,0 0 0 0 6,632.597 L417.667,632.597 A0,0 0 0 0 417.667,632.597 L417.667,616.498 L407.667,606.498 L216,606.498 L212,545.508 L208,606.498 L6,606.498 A0,0 0 0 0 6,606.498" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M407.667,606.498 L407.667,616.498 L417.667,616.498 L407.667,606.498" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="624.63" fill="#172033" font-size="14" textLength="390.667" font-family="Arial">Align limits across layers; defaults do not guarantee throughput</text></g><!--link Client to Nginx--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-source-line="15" data-link-type="dependency"><path d="M368,127.538 C368,146.798 368,164.958 368,183.398" style="stroke:#181818;stroke-width:1;" fill="none" id="Client-to-Nginx"/><polygon points="368,188.398,372