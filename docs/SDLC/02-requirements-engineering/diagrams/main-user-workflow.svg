<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:626px;height:1193px;background:#FFFFFF;" width="626px" height="1193px" viewBox="0 0 626 1193" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="215.069" y="24.533" fill="#000" font-size="14" textLength="189.048" font-weight="700">main user workflow diagram</text></g><!--entity Start--><g class="entity" data-qualified-name="Start" id="ent0001" data-source-line="3"><rect x="325" y="45.609" width="223.889" height="37.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="335" y="70.143" fill="#000" font-size="14" textLength="203.889">Authenticate as repository owner</text></g><!--entity Create--><g class="entity" data-qualified-name="Create" id="ent0002" data-source-line="4"><rect x="309" y="144.609" width="255.778" height="37.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="319" y="169.143" fill="#000" font-size="14" textLength="235.778">Create repository and choose visibility</text></g><!--entity Token--><g class="entity" data-qualified-name="Token" id="ent0003" data-source-line="5"><rect x="349.5" y="243.609" width="174.875" height="37.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="359.5" y="268.143" fill="#000" font-size="14" textLength="154.875">Issue Git token if needed</text></g><!--entity Push--><g class="entity" data-qualified-name="Push" id="ent0004" data-source-line="6"><rect x="293" y="342.609" width="287.702" height="37.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="303" y="367.143" fill="#000" font-size="14" textLength="267.702">Clone or initialize and push committed data</text></g><!--entity Browse--><g class="entity" data-qualified-name="Browse" id="ent0005" data-source-line="7"><rect x="314.5" y="441.609" width="244.889" height="37.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="324.5" y="466.143" fill="#000" font-size="14" textLength="224.889">Browse branch history files and tags</text></g><!--entity Branch--><g class="entity" data-qualified-name="Branch" id="ent0006" data-source-line="8"><rect x="317.5" y="540.609" width="238.709" height="37.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="327.5" y="565.143" fill="#000" font-size="14" textLength="218.709">Create a branch and push changes</text></g><!--entity Request--><g class="entity" data-qualified-name="Request" id="ent0007" data-source-line="9"><rect x="319.5" y="639.609" width="234.771" height="37.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="329.5" y="664.143" fill="#000" font-size="14" textLength="214.771">Open same-repository pull request</text></g><!--entity Review--><g class="entity" data-qualified-name="Review" id="ent0008" data-source-line="10"><rect x="328" y="738.609" width="218.44" height="37.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="338" y="763.143" fill="#000" font-size="14" textLength="198.44">Review comparison and hashes</text></g><!--entity Valid--><g class="entity" data-qualified-name="Valid" id="ent0009" data-source-line="11"><polygon points="452,851.609,343,837.609,125,837.609,16,851.609,125,865.609,343,865.609,452,851.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="124.965" y="857.143" fill="#000" font-size="14" textLength="217.93">Refs unchanged and merge clean?</text></g><!--entity Merge--><g class="entity" data-qualified-name="Merge" id="ent0010" data-source-line="12"><rect x="123" y="943.609" width="221.544" height="37.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="133" y="968.143" fill="#000" font-size="14" textLength="201.544">Owner merges reviewed change</text></g><!--entity Resolve--><g class="entity" data-qualified-name="Resolve" id="ent0011" data-source-line="13"><rect x="386" y="943.609" width="226.186" height="37.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="396" y="968.143" fill="#000" font-size="14" textLength="206.186">Resolve conflict or refresh review</text></g><!--entity Checks--><g class="entity" data-qualified-name="Checks" id="ent0012" data-source-line="14"><rect x="125" y="1042.609" width="217.668" height="37.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="135" y="1067.143" fill="#000" font-size="14" textLength="197.668">Optionally queue built-in checks</text></g><!--entity Worker--><g class="entity" data-qualified-name="Worker" id="ent0013" data-source-line="15"><rect x="127" y="1141.609" width="213.744" height="37.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="137" y="1166.143" fill="#000" font-size="14" textLength="193.744">Running worker records results</text></g><!--link Start to Create--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk14" data-source-line="16" data-link-type="dependency"><path d="M437,83.849 C437,101.199 437,122.129 437,139.449" style="stroke:#181818;stroke-width:1;" fill="none" id="Start-to-Create"/><polygon points="437,144.449,441,135.449,437,139.449,433,135.449,437,144.449" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Create to Token--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk15" data-source-line="17" data-link-type="dependency"><path d="M437,182.849 C437,200.199 437,221.129 437,238.449" style="stroke:#181818;stroke-width:1;" fill="none" id="Create-to-Token"/><polygon points="437,243.449,441,23