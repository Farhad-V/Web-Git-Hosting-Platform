name: Refresh Composer Lock

on:
  push:
    branches:
      - chore/repository-cleanup
    paths:
      - ".github/workflows/refresh-composer-lock.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v5
        with:
          ref: chore/repository-cleanup

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Refresh lock metadata without changing dependency versions
        run: composer update --lock --no-install --no-interaction --no-progress

      - name: Commit synchronized lock file
        shell: bash
        run: |
          if git diff --quiet -- composer.lock; then
            echo "composer.lock already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "chore: synchronize Composer lock metadata"
          git push origin HEAD:chore/repository-cleanup
