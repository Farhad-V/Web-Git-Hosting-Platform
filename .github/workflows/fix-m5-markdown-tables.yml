name: Fix M5 Markdown Tables

on:
  push:
    branches:
      - fix/m5-markdown-tables

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: fix/m5-markdown-tables

      - name: Normalize Markdown tables
        run: python tools/fix_m5_markdown_tables.py

      - name: Commit table fixes
        shell: bash
        run: |
          if git diff --quiet -- docs/06-testing; then
            echo "No Markdown table changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/06-testing
          git commit -m "docs: fix M5 Markdown table rendering"
          git push origin HEAD:fix/m5-markdown-tables
