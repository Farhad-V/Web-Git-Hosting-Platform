name: Deployment Validation

on:
  push:
    branches:
      - main
      - deployment/m6
    paths:
      - "deployment/**"
      - "docs/SDLC/07-deployment/**"
      - ".github/workflows/deployment-validation.yml"
      - "backend/**"
      - "frontend/**"
  pull_request:
    branches:
      - main
    paths:
      - "deployment/**"
      - "docs/SDLC/07-deployment/**"
      - ".github/workflows/deployment-validation.yml"
      - "backend/**"
      - "frontend/**"

permissions:
  contents: read

concurrency:
  group: deployment-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-deployment:
    name: Production-like deployment validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: git_hosting_platform_deploy
          POSTGRES_USER: git_hosting_app
          POSTGRES_PASSWORD: ci_database_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=git_hosting_app --dbname=git_hosting_platform_deploy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: http://127.0.0.1:8080
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: git_hosting_platform_deploy
      DB_USERNAME: git_hosting_app
      DB_PASSWORD: ci_database_password
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
      GITFORGE_GIT_BINARY: /usr/bin/git
      GITFORGE_REPOSITORY_ROOT: /tmp/gitforge-storage

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql, pgsql
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate deployment templates
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'APP_ENV=production' deployment/env/production.env.example
          grep -Fxq 'APP_DEBUG=false' deployment/env/production.env.example
          grep -Fxq 'SESSION_SECURE_COOKIE=true' deployment/env/production.env.example
          grep -Fxq 'GITFORGE_GIT_BINARY=/usr/bin/git' deployment/env/production.env.example
          grep -Fxq 'GITFORGE_REPOSITORY_ROOT=/var/lib/gitforge' deployment/env/production.env.example
          grep -Fq 'server_tokens off;' deployment/nginx/gitforge.conf
          grep -Fq 'fastcgi_request_buffering off;' deployment/nginx/gitforge.conf
          grep -Fq 'user = gitforge' deployment/php-fpm/gitforge.conf
          grep -Fq 'clear_env = yes' deployment/php-fpm/gitforge.conf
          test ! -e deployment/env/production.env

      - name: Lint deployment shell scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in deployment/scripts/*.sh; do
            bash -n "$script"
          done

      - name: Test backup coordination guards
        shell: bash
        run: bash deployment/tests/backup-test.sh

      - name: Install production backend dependencies
        working-directory: backend
        run: >-
          composer install
          --no-dev
          --no-interaction
          --prefer-dist
          --no-progress
          --optimize-autoloader

      - name: Prepare production-like Laravel environment
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          cp ../deployment/env/production.env.example .env
          sed -i 's#APP_URL=https://gitforge.example.com#APP_URL=http://127.0.0.1:8080#' .env
          sed -i 's/DB_DATABASE=git_hosting_platform/DB_DATABASE=git_hosting_platform_deploy/' .env
          sed -i 's/DB_PASSWORD=$/DB_PASSWORD=ci_database_password/' .env
          sed -i 's#GITFORGE_REPOSITORY_ROOT=/var/lib/gitforge#GITFORGE_REPOSITORY_ROOT=/tmp/gitforge-storage#' .env
          php artisan key:generate --force
          mkdir -p /tmp/gitforge-storage/repositories
          php artisan config:clear
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache

      - name: Build production frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - name: Validate Nginx configuration syntax
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx openssl
          sudo mkdir -p /etc/letsencrypt/live/gitforge.example.com
          sudo openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout /etc/letsencrypt/live/gitforge.example.com/privkey.pem \
            -out /etc/letsencrypt/live/gitforge.example.com/fullchain.pem \
            -subj '/CN=gitforge.example.com' >/dev/null 2>&1
          sudo cp deployment/nginx/gitforge.conf /etc/nginx/conf.d/gitforge.conf
          sudo nginx -t

      - name: Run application liveness smoke test
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          php artisan serve --host=127.0.0.1 --port=8080 >/tmp/gitforge-artisan.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/up >/tmp/gitforge-up.txt; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gitforge-artisan.log
          exit 1

      - name: Verify production optimization state
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap/cache/config.php
          test -f bootstrap/cache/routes-v7.php || test -f bootstrap/cache/routes.php
